<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Test Cloudinary</title>
</head>
<body>

  <h2>Test Cloudinary</h2>

  <input type="file" id="file" accept="image/*">
  <button id="upload">Carica immagine</button>

  <script>
    document.getElementById('upload').addEventListener('click', async () => {
      const file = document.getElementById('file').files[0];

      if (!file) {
        alert('Seleziona prima un immagine');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'catalogo_test');

      alert(
        'Invio a Cloudinary\\n\\n' +
        'Cloud: dq1io8iet\\n' +
        'Preset: ' + formData.get('upload_preset') + '\\n' +
        'File: ' + file.name
      );

      try {
        const response = await fetch(
          'https://api.cloudinary.com/v1_1/dq1io8iet/image/upload',
          {
            method: 'POST',
            body: formData
          }
        );

        const text = await response.text();

        alert(
          'RISPOSTA CLOUDINARY\\n\\n' +
          'Status: ' + response.status + '\\n\\n' +
          text
        );

      } catch (error) {
        alert('ERRORE FETCH\\n\\n' + error.message);
      }
    });
  </script>

</body>
</html>
